name: Build iOS ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add iOS platform (if missing)
        run: npx cap add ios || true

      - name: Sync Capacitor (copies config + webDir, runs pod install)
        run: npx cap sync ios

      - name: Build .app (unsigned)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package ipa (unsigned)
        run: |
          mkdir -p Payload
          cp -R "ios/App/build/Build/Products/Release-iphoneos/App.app" Payload/
          zip -r -y Towa-unsigned.ipa Payload
          ls -la Towa-unsigned.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Towa-unsigned.ipa
          path: Towa-unsigned.ipa

      - name: Upload .app artifact (debug备用)
        uses: actions/upload-artifact@v4
        with:
          name: App.app
          path: ios/App/build/Build/Products/Release-iphoneos/App.app
